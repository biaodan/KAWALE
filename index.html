<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Creation | Career Opportunities</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#0A192F] text-slate-300">

    <!-- Hero Section -->
    <header class="py-20 text-center">
        <h1 class="text-4xl md:text-5xl font-bold text-[#E6F1FF] mb-6">Cloud Creation International</h1>
        <p class="text-xl text-[#64FFDA] tracking-widest uppercase">Global Warehousing & Trading Solutions</p>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-8 pb-20">
        
        <!-- Box 1 -->
        <div class="bg-[#112240] p-8 rounded-xl border border-slate-700 hover:border-[#64FFDA] transition-all">
            <i data-lucide="package" class="text-[#64FFDA] w-10 h-10 mb-6"></i>
            <h2 class="text-xl font-semibold text-[#E6F1FF] mb-4">岗位职责</h2>
            <ul class="space-y-3 text-sm">
                <li>• 处理物流订单调度</li>
                <li>• 商品信息数字化更新</li>
                <li>• 全链路状态追踪</li>
            </ul>
        </div>

        <!-- Box 2 -->
        <div class="bg-[#112240] p-8 rounded-xl border border-slate-700 hover:border-[#64FFDA] transition-all">
            <i data-lucide="trending-up" class="text-[#64FFDA] w-10 h-10 mb-6"></i>
            <h2 class="text-xl font-semibold text-[#E6F1FF] mb-4">薪资与门槛</h2>
            <p class="text-3xl font-bold text-white mb-2">1,000–7,000 <span class="text-sm font-normal">泰铢/天</span></p>
            <p class="text-sm">22–55岁，具备数字化操作能力者可放宽至65岁</p>
        </div>

        <!-- Box 3 -->
        <div class="bg-[#112240] p-8 rounded-xl border border-slate-700 hover:border-[#64FFDA] transition-all">
            <i data-lucide="cloud" class="text-[#64FFDA] w-10 h-10 mb-6"></i>
            <h2 class="text-xl font-semibold text-[#E6F1FF] mb-4">核心优势</h2>
            <p class="text-sm">居家办公模式，每日仅需2–4小时作业，提供全程数字化专业培训支持。</p>
        </div>
    </main>

    <!-- Action Section -->
    <section class="text-center pb-20">
        <button class="bg-transparent border-2 border-[#64FFDA] text-[#64FFDA] px-10 py-4 rounded-lg font-bold hover:bg-[#64FFDA] hover:text-[#0A192F] transition-all">
            立即申请 (Apply Now)
        </button>
    </section>

    <script> lucide.createIcons(); </script>
</body>
</html>
